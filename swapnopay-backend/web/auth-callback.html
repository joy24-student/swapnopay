<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Verified | SwapnoPay (স্বপ্নপে)</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #111d2e 0%, #070b12 100%);
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-gold: #f59e0b;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.3);
      position: relative;
    }

    .icon-wrapper.error {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .icon-check {
      font-size: 40px;
      color: var(--accent-green);
    }

    .icon-cross {
      font-size: 40px;
      color: #ef4444;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-green-hover) 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 24px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .countdown {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .countdown b {
      color: var(--accent-green);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="iconBox" class="icon-wrapper">
      <span id="iconSymbol" class="icon-check">✓</span>
    </div>

    <h1 id="headline" class="brand-title">ইমেল যাচাই <span>সফল হয়েছে!</span></h1>
    <p id="subline" class="subtitle">আপনার অ্যাকাউন্ট যাচাইকরণ সম্পন্ন হয়েছে। মোবাইল অ্যাপ চালু হচ্ছে...</p>

    <div class="button-group">
      <a id="openAppBtn" href="#" class="btn-primary">
        <span>📱</span> SwapnoPay অ্যাপ খুলুন
      </a>
      <a id="portalBtn" href="/portal.html" class="btn-secondary">
        ওয়েব পোর্টাল দেখুন (Web Portal)
      </a>
    </div>

    <p id="countdownText" class="countdown">
      <span id="timerVal">২</span> সেকেন্ডের মধ্যে স্বয়ংক্রিয়ভাবে অ্যাপ রিডাইরেক্ট হবে...
    </p>
  </div>

  <script>
    (function() {
      // 1. Parse hash parameters (Supabase Auth implicit flow) & query parameters
      var hash = window.location.hash.substring(1);
      var search = window.location.search.substring(1);
      var rawParams = hash || search;

      var params = {};
      if (rawParams) {
        var pairs = rawParams.split('&');
        for (var i = 0; i < pairs.length; i++) {
          var kv = pairs[i].split('=');
          if (kv.length >= 2) {
            params[kv[0]] = decodeURIComponent(kv[1].replace(/\+/g, ' '));
          }
        }
      }

      var error = params.error_description || params.error;
      var accessToken = params.access_token;
      var authType = params.type || 'signup';

      var iconBox = document.getElementById('iconBox');
      var iconSymbol = document.getElementById('iconSymbol');
      var headline = document.getElementById('headline');
      var subline = document.getElementById('subline');
      var openAppBtn = document.getElementById('openAppBtn');
      var countdownText = document.getElementById('countdownText');

      // Construct Deep Link to Android App
      var targetSuffix = window.location.hash || window.location.search || '';
      var deepLink = 'swapnopay://auth-callback' + targetSuffix;
      openAppBtn.href = deepLink;

      if (error) {
        iconBox.className = 'icon-wrapper error';
        iconSymbol.className = 'icon-cross';
        iconSymbol.innerText = '✕';
        headline.innerHTML = 'যাচাইকরণ <span>ব্যর্থ হয়েছে</span>';
        subline.innerText = error;
        countdownText.innerText = 'অনুগ্রহ করে অ্যাপে ফিরে আবার চেষ্টা করুন।';
        return;
      }

      if (authType === 'recovery') {
        headline.innerHTML = 'পাসওয়ার্ড রিসেট <span>অনুমোদিত!</span>';
        subline.innerText = 'আপনার পাসওয়ার্ড পরিবর্তন করতে SwapnoPay অ্যাপ চালু করুন।';
      }

      // Auto-trigger deep link after 400ms
      setTimeout(function() {
        window.location.href = deepLink;
      }, 400);

      // Countdown visualization
      var sec = 2;
      var interval = setInterval(function() {
        sec--;
        var timerSpan = document.getElementById('timerVal');
        if (timerSpan) timerSpan.innerText = sec;
        if (sec <= 0) {
          clearInterval(interval);
          if (countdownText) {
            countdownText.innerHTML = 'অ্যাপ চালু না হলে উপরের <b>SwapnoPay অ্যাপ খুলুন</b> বাটনে চাপুন।';
          }
        }
      }, 1000);
    })();
  </script>
</body>
</html>
