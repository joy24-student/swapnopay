server {
    listen 80;
    server_name pay.swapnopay.top swapnopay.top localhost _;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html widget.html docs.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SwapnoPay E-Commerce Storefront (.php requests to shop-php container)
    # Path-based Storefront Static Assets (/slug/assets/...)
    location ~* ^/([a-zA-Z0-9_-]+)/assets/(.*)$ {
        alias /var/www/html/assets/$2;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Path-based Storefront Admin static assets (/slug/admin/css/..., /slug/admin/style.css, etc.)
    location ~* ^/([a-zA-Z0-9_-]+)/admin/((?!.*\.php$).*)$ {
        alias /var/www/html/admin/$2;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Path-based Storefront Admin PHP (/slug/admin/*.php)
    location ~* ^/([a-zA-Z0-9_-]+)/admin/(.+\.php)$ {
        fastcgi_pass shop-php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/admin/$2;
        include fastcgi_params;
    }

    # Path-based Storefront Admin root (/slug/admin or /slug/admin/)
    location ~* ^/([a-zA-Z0-9_-]+)/admin/?$ {
        fastcgi_pass shop-php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/admin/index.php;
        include fastcgi_params;
    }

    # Path-based Storefront direct PHP scripts (/slug/*.php)
    location ~* ^/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+\.php)$ {
        fastcgi_pass shop-php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/$2;
        include fastcgi_params;
    }

    location ~ \.php$ {
        root /var/www/html;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass shop-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Hosted Form Dynamic Routes (/f/* or /forms/*)
    location ~* ^/(f|forms|form)/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        try_files $uri /form.html?$args;
    }

    # Public aliases use the same canonical URLs as the HTML metadata.
    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /$is_args$args; }
    location = /docs { return 301 /docs.html$is_args$args; }
    location = /doc { return 301 /docs.html$is_args$args; }
    location = /documentation { return 301 /docs.html$is_args$args; }
    location = /portal { return 301 /portal.html$is_args$args; }
    location = /console { return 301 /portal.html$is_args$args; }
    location = /developer { return 301 /portal.html$is_args$args; }
    location = /dev { return 301 /portal.html$is_args$args; }
    location = /sandbox { return 301 /portal.html$is_args$args; }
    location = /keys { return 301 /portal.html$is_args$args; }
    location = /widget { try_files /widget.html =404; }
    location = /form { try_files /form.html =404; }

    # Static Web Assets (with public CORS headers for widget embeds)
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Webhook-Secret" always;
        try_files $uri $uri/ =404;
    }

    # Proxy Uploaded Media Assets (/uploads/*)
    location /uploads/ {
        proxy_pass http://swapnopay-backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy SwapnoPay Backend API (/v1/*)
    location /v1/ {
        proxy_pass http://swapnopay-backend:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io WebSockets (/socket.io/)
    location /socket.io/ {
        proxy_pass http://swapnopay-backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend Health Check (/health and /healthz)
    location ~* ^/(health|healthz)$ {
        proxy_pass http://swapnopay-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
