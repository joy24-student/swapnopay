name: SwapnoPay Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Job 1: Build & Verify Android Application
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      continue-on-error: true

    - name: Build Merchant Debug Application
      run: ./gradlew :app:assembleMerchantDebug --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: swapnopay-merchant-debug-apk-ci
        path: app/build/outputs/apk/merchant/debug/app-merchant-debug.apk
        retention-days: 14

  # Job 2: Validate Serverless Edge Functions
  validate-deno:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Deno Environment
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.35.x

    - name: Lint and Format verification
      run: |
        deno lint supabase/functions/
        deno fmt --check supabase/functions/
      continue-on-error: true # Warnings only
