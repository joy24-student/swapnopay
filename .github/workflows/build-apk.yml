name: Build Android Debug APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.0.0-debug'

permissions:
  contents: write

jobs:
  build:
    name: Build Merchant Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Merchant Debug APK
        run: ./gradlew :app:assembleMerchantDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/merchant/debug/
          test -f app/build/outputs/apk/merchant/debug/app-merchant-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapnopay-merchant-debug-apk
          path: app/build/outputs/apk/merchant/debug/app-merchant-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: SwapnoPay Merchant Debug APK (${{ github.event.inputs.release_tag || github.ref_name }})
          body: |
            ### SwapnoPay Merchant Debug APK
            - **Commit**: ${{ github.sha }}
            - **Flavor**: `merchantDebug` (`com.swapnopay`)
            - **Features**:
              - Real-time MFS payment notifications and matching
              - Customer appeals hub with payment screenshot viewer and note
              - Reload-proof payment verification gateway with session auto-recovery
              - Dynamic Supabase database schema compatibility
          files: app/build/outputs/apk/merchant/debug/app-merchant-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
