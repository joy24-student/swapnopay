# ==============================================================================
# SwapnoPay Production Nginx Configuration
# Domains: swapnopay.top, pay.swapnopay.top, admin.swapnopay.top, api.swapnopay.top, shop.swapnopay.top
# ==============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# 1. Main Web & Payment Gateway (pay.swapnopay.top & swapnopay.top)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pay.swapnopay.top swapnopay.top www.swapnopay.top;

    root /var/www/swapnopay/web;
    index index.html widget.html docs.html;

    # Maximum file upload size (for KYC documents & store branding)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Public aliases use the same canonical URLs as the HTML metadata.
    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /$is_args$args; }
    location = /docs { return 301 /docs.html$is_args$args; }
    location = /doc { return 301 /docs.html$is_args$args; }
    location = /documentation { return 301 /docs.html$is_args$args; }
    location = /portal { return 301 /portal.html$is_args$args; }
    location = /console { return 301 /portal.html$is_args$args; }
    location = /developer { return 301 /portal.html$is_args$args; }
    location = /dev { return 301 /portal.html$is_args$args; }
    location = /sandbox { return 301 /portal.html$is_args$args; }
    location = /keys { return 301 /portal.html$is_args$args; }
    location = /widget { try_files /widget.html =404; }
    location = /form { try_files /form.html =404; }
    location = /auth-callback { try_files /auth-callback.html =404; }

    # Static Assets & Embeddable Checkout Widget
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Webhook-Secret" always;
        try_files $uri $uri/ =404;
    }

    # Hosted Checkout Form Dynamic Slugs (/f/*, /forms/*, /form/*)
    location ~* ^/(f|forms|form)/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        try_files $uri /form.html?$args;
    }

    # Proxy SwapnoPay Central Backend API (/v1/*)
    location /v1/ {
        proxy_pass http://127.0.0.1:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy Supabase OAuth Callbacks & Functions
    location /oauth/ {
        proxy_pass http://127.0.0.1:4000/oauth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /functions/ {
        proxy_pass http://127.0.0.1:4000/functions/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Uploads (KYC images, proof slips, product photos)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Socket.io Realtime WebSockets (/socket.io/)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend Health Check
    location ~* ^/(health|healthz)$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# 2. Direct API Gateway (api.swapnopay.top)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.swapnopay.top;

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# 3. Admin Control Panel (admin.swapnopay.top)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.swapnopay.top;

    root /var/www/swapnopay/admin/dist;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Proxy SwapnoPay Central Backend API (/v1/*)
    location /v1/ {
        proxy_pass http://127.0.0.1:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Direct Health Check Probes (/healthz)
    location = /healthz {
        proxy_pass http://127.0.0.1:4000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API / Monitor Health Probe (/health)
    # If requested by curl, uptime bots, or with Accept: application/json or ?format=json
    location = /health {
        if ($http_accept !~* "text/html") {
            rewrite ^ /internal_health last;
        }
        if ($args ~* "json") {
            rewrite ^ /internal_health last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /internal_health {
        internal;
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# 4. Merchant Web Storefront (shop.swapnopay.top)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name shop.swapnopay.top shops.swapnopay.top;

    root /var/www/swapnopay/shop;
    index index.php index.html;

    client_max_body_size 64M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Path-based Storefront Static Assets (/slug/assets/...)
    location ~* ^/([a-zA-Z0-9_-]+)/assets/(.*)$ {
        alias /var/www/swapnopay/shop/assets/$2;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Path-based Storefront Admin static assets (/slug/admin/css/..., /slug/admin/style.css, etc.)
    location ~* ^/([a-zA-Z0-9_-]+)/admin/((?!.*\.php$).*)$ {
        alias /var/www/swapnopay/shop/admin/$2;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Path-based Storefront Admin PHP (/slug/admin/*.php)
    location ~* ^/([a-zA-Z0-9_-]+)/admin/(.+\.php)$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/swapnopay/shop/admin/$2;
        fastcgi_param SHOP_RUNTIME_DIR /var/www/swapnopay/swapnopay-backend/data/shop-runtime;
        include fastcgi_params;
    }

    # Path-based Storefront Admin root (/slug/admin or /slug/admin/)
    location ~* ^/([a-zA-Z0-9_-]+)/admin/?$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/swapnopay/shop/admin/index.php;
        fastcgi_param SHOP_RUNTIME_DIR /var/www/swapnopay/swapnopay-backend/data/shop-runtime;
        include fastcgi_params;
    }

    # Path-based Storefront direct PHP scripts (/slug/*.php)
    location ~* ^/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+\.php)$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/swapnopay/shop/$2;
        fastcgi_param SHOP_RUNTIME_DIR /var/www/swapnopay/swapnopay-backend/data/shop-runtime;
        include fastcgi_params;
    }

    # Path-based Storefront clean URLs and home (/slug or /slug/ or /slug/product/...)
    location ~* ^/([a-zA-Z0-9_-]+)(/.*)?$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/swapnopay/shop/index.php;
        fastcgi_param SHOP_RUNTIME_DIR /var/www/swapnopay/swapnopay-backend/data/shop-runtime;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SHOP_RUNTIME_DIR /var/www/swapnopay/swapnopay-backend/data/shop-runtime;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# 5. Merchant Custom Domains (Catch-All)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/swapnopay/shop;
    index index.php index.html;

    client_max_body_size 64M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SHOP_RUNTIME_DIR /var/www/swapnopay/swapnopay-backend/data/shop-runtime;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
