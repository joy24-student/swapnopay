<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Ticket -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5e00"/>
      <stop offset="40%" stop-color="#ff3b00"/>
      <stop offset="100%" stop-color="#d60000"/>
    </linearGradient>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff5ea"/>
      <stop offset="100%" stop-color="#ffddba"/>
    </linearGradient>

    <!-- Flat 15% Off Gradient -->
    <linearGradient id="discountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1e0"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6200"/>
      <stop offset="100%" stop-color="#e62e00"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff3b00" flood-opacity="0.3"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7a0000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#3d0000" flood-opacity="0.9"/>
    </filter>

    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#540000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Group for whole sticker with master shadow -->
  <g filter="url(#stickerShadow)">
    <!-- Scalloped Ticket Body -->
    <path d="
      M 70 80
      Q 85 65, 100 80
      Q 115 65, 130 80
      Q 145 65, 160 80
      Q 175 65, 190 80
      Q 205 65, 220 80
      Q 235 65, 250 80
      Q 265 65, 280 80
      Q 295 65, 310 80
      Q 325 65, 340 80
      Q 355 65, 370 80
      Q 385 65, 400 80
      Q 415 65, 430 80
      L 430 520
      Q 415 535, 400 520
      Q 385 535, 370 520
      Q 355 535, 340 520
      Q 325 535, 310 520
      Q 295 535, 280 520
      Q 265 535, 250 520
      Q 235 535, 220 520
      Q 205 535, 190 520
      Q 175 535, 160 520
      Q 145 535, 130 520
      Q 115 535, 100 520
      Q 85 535, 70 520
      Z
    " fill="url(#ticketGrad)" stroke="#ffffff" stroke-width="4"/>

    <!-- Inner Gloss Arc -->
    <path d="
      M 72 82
      L 428 82
      L 428 320
      C 300 240, 180 340, 72 260
      Z
    " fill="url(#glossGrad)"/>

    <!-- Scalloped Yellow Accent Ring Curve -->
    <path d="
      M 70 120
      C 180 100, 320 100, 430 120
    " fill="none" stroke="#ffe600" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- WELCOME Text (Arched / Bold 3D) -->
    <g filter="url(#textGlow)">
      <text x="250" y="165" font-family="'Impact', 'Arial Black', sans-serif" font-size="58" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="3" stroke="#9e0c00" stroke-width="4" paint-order="stroke fill">
        WELCOME
      </text>
    </g>

    <!-- Center Accent Line / Ribbon -->
    <path d="M 100 185 L 400 185" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>

    <!-- FLAT 15% OFF Text -->
    <g filter="url(#textGlow)">
      <text x="250" y="275" font-family="'Impact', 'Arial Black', sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1" stroke="#a60000" stroke-width="6" paint-order="stroke fill">
        FLAT 15% OFF
      </text>
    </g>

    <!-- White Pill Badge: "ON YOUR FIRST ORDER TODAY" -->
    <g filter="url(#btnShadow)">
      <rect x="85" y="325" width="330" height="52" rx="26" fill="#ffffff"/>
      <text x="250" y="360" font-family="'Arial Black', 'Inter', sans-serif" font-size="17" font-weight="900" fill="#e62e00" text-anchor="middle" letter-spacing="1">
        ON YOUR FIRST ORDER TODAY
      </text>
    </g>

    <!-- Glowing CTA Button: "EXPLORE NOW" -->
    <g filter="url(#btnShadow)">
      <rect x="130" y="420" width="240" height="60" rx="30" fill="url(#btnGrad)" stroke="#ffffff" stroke-width="3.5"/>
      <text x="250" y="458" font-family="'Arial Black', 'Inter', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
        EXPLORE NOW
      </text>
    </g>
  </g>
</svg>
